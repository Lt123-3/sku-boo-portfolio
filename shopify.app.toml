client_id = "YOUR_SHOPIFY_CLIENT_ID"
name = "SKU Boo"
application_url = "https://skuboo.com/app"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "products/create" ]
  uri = "/webhooks/products/create"

  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products/update"

  [[webhooks.subscriptions]]
  topics = [ "products/delete" ]
  uri = "/webhooks/products/delete"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
scopes = "write_products,read_products,read_locations,read_inventory,write_files,read_orders,read_customers,write_inventory"

[auth]
redirect_urls = [
  "https://skuboo.com/auth/callback",
  "https://skuboo.com/auth/shopify/callback",
  "https://skuboo.com/api/auth/callback",
  "https://skuboo.com/api/auth"
]
